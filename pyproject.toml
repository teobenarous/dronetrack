[project]
name = "dronetrack"
version = "0.1.0"
description = "Real-time detection and tracking of a single drone from a ground camera"
readme = "README.md"
authors = [
    { name = "teo", email = "96968228+teobenarous@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "lap==0.5.14",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "onnx==1.23.2",
    "onnxruntime==1.31.1",
    "opencv-python==5.0.0.93",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "scipy==1.18.1",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "tqdm==4.70.1",
    "typer==0.28.0",
    "ultralytics==8.4.207",
]

[project.scripts]
dronetrack = "dronetrack.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
"src/dronetrack/{detector,training,experiments}.py" = ["E402"]
"src/dronetrack/plots.py" = ["E402"]
"scripts/benchmark_training.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ultralytics.*", "cv2.*"]
follow_imports = "skip"
